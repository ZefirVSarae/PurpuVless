<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurpuVless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1e1b4b;
            color: #f5f3ff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .config-card {
            background: rgba(88, 28, 135, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .config-card:hover {
            background: rgba(88, 28, 135, 0.5);
            border-color: rgba(139, 92, 246, 0.6);
        }
        .btn-purple {
            background-color: #7c3aed;
        }
        .btn-purple:hover {
            background-color: #8b5cf6;
        }
        .details-panel {
            display: none;
        }
        .details-panel.open {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-sm flex flex-col">
    <div class="max-w-4xl mx-auto flex-1 w-full">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-fuchsia-300 mb-1">PurpuVless</h1>
            </div>
            <div class="flex gap-3">
                <button id="refreshBtn" class="btn-purple text-white px-6 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-purple-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
                    Обновить
                </button>
                <button id="copyAllBtn" class="bg-indigo-900/50 hover:bg-indigo-800 text-white px-6 py-2.5 rounded-xl font-bold transition-all border border-indigo-700/50">
                    Копировать всё
                </button>
            </div>
        </header>

        <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl text-center font-bold"></div>

        <div id="loader" class="flex justify-center items-center py-32">
            <div class="h-16 w-16 rounded-full border-t-4 border-b-4 border-purple-500 animate-spin"></div>
        </div>

        <div id="configContainer" class="grid grid-cols-1 gap-4 hidden"></div>

        <div id="emptyState" class="hidden text-center py-32">
            <div class="text-purple-300 opacity-50 mb-4">
                <svg class="mx-auto" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </div>
            <p class="text-purple-200 text-xl font-medium">Список пуст или сервер недоступен</p>
        </div>
    </div>

    <footer class="mt-12 mb-4 text-center">
        <p class="text-slate-500 text-xs italic tracking-wide">Vless берутся из открытых источников и не все могут работать!</p>
    </footer>

    <script>
        const configContainer = document.getElementById('configContainer');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('emptyState');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const statusMessage = document.getElementById('statusMessage');

        let currentConfigs = [];

        async function fetchConfigs() {
            showLoader(true);
            hideStatus();
            
            try {
                const response = await fetch('https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt');
                if (!response.ok) throw new Error('Error');
                
                const content = await response.text();
                currentConfigs = content.split('\n').map(line => line.trim()).filter(line => line !== '');
                renderConfigs(currentConfigs);
            } catch (error) {
                showStatus('Ошибка подключения к источнику', 'bg-red-500/20 text-red-300 border border-red-500/50');
                showLoader(false);
                emptyState.classList.remove('hidden');
            }
        }

        function parseConfig(config) {
            try {
                const url = new URL(config.replace('vless://', 'http://'));
                const id = url.username;
                const address = url.hostname;
                const port = url.port;
                const type = config.split('://')[0];
                const params = Object.fromEntries(url.searchParams);
                return { id, address, port, type, security: params.security || 'none', sni: params.sni || 'none', type_net: params.type || 'tcp' };
            } catch (e) {
                return null;
            }
        }

        function renderConfigs(configs) {
            showLoader(false);
            configContainer.innerHTML = '';
            
            if (configs.length === 0) {
                emptyState.classList.remove('hidden');
                configContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            configContainer.classList.remove('hidden');

            configs.forEach((config, index) => {
                let name = extractName(config) || `Линия ${index + 1}`;
                const data = parseConfig(config);
                
                if (name.includes('🇷🇺')) {
                    name += ' <span class="text-green-400 text-[10px] ml-2 font-normal">(Маскирует трафик!)</span>';
                }
                
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'flex flex-col';

                const card = document.createElement('div');
                card.className = 'config-card p-5 rounded-2xl flex justify-between items-center gap-4 shadow-xl shadow-black/20 relative z-10';
                
                card.innerHTML = `
                    <div class="overflow-hidden flex-1">
                        <h3 class="font-black text-purple-100 text-base mb-1 flex items-center">${name}</h3>
                        <p class="text-xs text-purple-400/80 font-mono truncate">${config}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button class="details-btn bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-200 p-3 rounded-xl transition-all border border-indigo-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                        </button>
                        <button class="copy-single-btn bg-purple-600/30 hover:bg-purple-500 text-purple-100 p-3 rounded-xl transition-all border border-purple-500/30" data-config="${config}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                `;

                const details = document.createElement('div');
                details.className = 'details-panel bg-indigo-950/40 border-x border-b border-purple-500/20 rounded-b-2xl mx-2';
                if (data) {
                    details.innerHTML = `
                        <div class="p-4 grid grid-cols-2 gap-3 text-[11px]">
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Тип</span><span class="text-white font-bold">${data.type.toUpperCase()}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Порт</span><span class="text-white font-bold">${data.port}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5 col-span-2"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Адрес / Домен</span><span class="text-white font-mono break-all">${data.address}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5 col-span-2"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">UUID / Ключ</span><span class="text-white font-mono break-all">${data.id}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Шифрование</span><span class="text-white">${data.security}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Сеть</span><span class="text-white">${data.type_net}</span></div>
                        </div>
                    `;
                } else {
                    details.innerHTML = `<div class="p-4 text-center text-red-400">Не удалось разобрать данные</div>`;
                }
                
                card.querySelector('.details-btn').onclick = () => {
                    const isOpen = details.classList.contains('open');
                    if (!isOpen) {
                        details.classList.add('open');
                        card.classList.add('rounded-b-none');
                    } else {
                        details.classList.remove('open');
                        card.classList.remove('rounded-b-none');
                    }
                };

                cardWrapper.appendChild(card);
                cardWrapper.appendChild(details);
                configContainer.appendChild(cardWrapper);
            });

            document.querySelectorAll('.copy-single-btn').forEach(btn => {
                btn.onclick = function() {
                    copyToClipboard(this.getAttribute('data-config'));
                    const originalContent = this.innerHTML;
                    this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                    setTimeout(() => { this.innerHTML = originalContent; }, 1500);
                };
            });
        }

        function extractName(config) {
            try {
                if (config.includes('#')) {
                    return decodeURIComponent(config.split('#')[1]);
                }
            } catch(e) {}
            return null;
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        function showStatus(text, classes) {
            statusMessage.innerHTML = text;
            statusMessage.className = `mb-8 p-4 rounded-xl text-center font-bold ${classes}`;
            statusMessage.classList.remove('hidden');
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }

        function showLoader(show) {
            if (show) {
                loader.classList.remove('hidden');
                configContainer.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        refreshBtn.onclick = fetchConfigs;

        copyAllBtn.onclick = () => {
            if (currentConfigs.length > 0) {
                copyToClipboard(currentConfigs.join('\n'));
                showStatus('ВСЕ КОНФИГИ СКОПИРОВАНЫ', 'bg-purple-500/20 text-purple-200 border border-purple-500/50');
                setTimeout(hideStatus, 3000);
            }
        };

        window.onload = fetchConfigs;
    </script>
</body>
</html>
