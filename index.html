<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurpuVless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f5f3ff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .config-card {
            background: rgba(30, 27, 75, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(8px);
        }
        .config-card:hover {
            background: rgba(88, 28, 135, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }
        .btn-purple {
            background-color: #7c3aed;
        }
        .btn-purple:hover {
            background-color: #8b5cf6;
        }
        .details-panel {
            display: none;
        }
        .details-panel.open {
            display: block;
        }
        #sentinel {
            height: 20px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-sm flex flex-col">
    <div class="max-w-4xl mx-auto flex-1 w-full">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-fuchsia-300 mb-1">PurpuVless</h1>
                <p id="counter" class="text-slate-500 text-xs font-bold uppercase tracking-widest"></p>
            </div>
            <div class="flex gap-3">
                <button id="refreshBtn" class="btn-purple text-white px-6 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-purple-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
                    Обновить
                </button>
                <button id="copyAllBtn" class="bg-indigo-900/50 hover:bg-indigo-800 text-white px-6 py-2.5 rounded-xl font-bold transition-all border border-indigo-700/50">
                    Копировать всё
                </button>
            </div>
        </header>

        <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl text-center font-bold"></div>

        <div id="loader" class="flex flex-col justify-center items-center py-32 gap-4">
            <div class="h-16 w-16 rounded-full border-t-4 border-b-4 border-purple-500 animate-spin"></div>
            <p class="text-purple-400 font-medium animate-pulse">Поиск</p>
        </div>

        <div id="configContainer" class="grid grid-cols-1 gap-4 hidden"></div>
        <div id="sentinel"></div>

        <div id="emptyState" class="hidden text-center py-32">
            <div class="text-purple-300 opacity-50 mb-4">
                <svg class="mx-auto" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </div>
            <p class="text-purple-200 text-xl font-medium">Конфиги не найдены</p>
        </div>
    </div>

    <footer class="mt-12 mb-4 text-center">
        <p class="text-slate-500 text-xs italic tracking-wide">Куча влесс на ваш вкус и цвет!</p>
    </footer>

    <script>
        const sources = [
            'https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt',
            'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt',
            'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt',
            "https://raw.githubusercontent.com/10ium/ScrapeAndCategorize/main/output_configs/ShadowSocks.txt",
            "https://raw.githubusercontent.com/10ium/ScrapeAndCategorize/main/output_configs/USA.txt",
            "https://raw.githubusercontent.com/10ium/ScrapeAndCategorize/main/output_configs/Vless.txt",
            "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
            "https://raw.githubusercontent.com/55prosek-lgtm/vpn_config_for_russia/main/blacklist.txt",
            "https://raw.githubusercontent.com/ALIILAPRO/v2rayNG-Config/main/server.txt",
            "https://raw.githubusercontent.com/Ai123999/1Mond/main/1Mond_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/2Tues/main/2Tues_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/3Wend/main/3Wend_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/5Frid/main/5Frid_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/6Satu/main/6Satu_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/7Sand/main/7Sand_Notorgamers",
            "https://raw.githubusercontent.com/Ai123999/WhiteKeys/main/WhiteKeys",
            "https://raw.githubusercontent.com/Ai123999/WhiteeListSub/main/whitelistkeys",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2309/230916_0501M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2309/230923_2310M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2310/231004_0310M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2310/231009_1110M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2311/231122_1510M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2312/231213_1710M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2312/231218_0311M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2312/231223_1411M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/donated/2401/240109_1712M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/6aefdedc2cde21ff91bd14105393cda477c6ae21/update/2310/231005_0503.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231003_2310M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231004_2210M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231013_0508M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231018_2211M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231026_0711M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2310/231029_0710M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2311/231106_0910M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2401/240111_2111M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/a3a7ed0bcf661d1d503b0005812df1fdc7c6f4b0/donated/2401/240124_0210M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/c3954c9c5155b9c9726f46ef520ae22e29c6ebf1/selected/2311/231113_1936S.txt",
            "https://raw.githubusercontent.com/Airuop/archive/c3954c9c5155b9c9726f46ef520ae22e29c6ebf1/selected/2311/231127_1045S.txt",
            "https://raw.githubusercontent.com/Airuop/archive/f020a942e86d0a0f8e5b1abe53d6348e27b54103/donated/2312/231202_0011M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/f020a942e86d0a0f8e5b1abe53d6348e27b54103/donated/2312/231231_0710M.txt",
            "https://raw.githubusercontent.com/Airuop/archive/f020a942e86d0a0f8e5b1abe53d6348e27b54103/update/2310/231005_0503.txt",
            "https://raw.githubusercontent.com/Airuop/archive/f020a942e86d0a0f8e5b1abe53d6348e27b54103/update/2310/231005_0701.txt",
            "https://raw.githubusercontent.com/Airuop/cross/master/sub/sub_merge.txt",
            "https://raw.githubusercontent.com/AmirHDevo/temp2/7f15e7ddb311a6f8c5ab338bd1af0e1f2136a84b/configs.txt",
            "https://raw.githubusercontent.com/Argh94/Proxy-List/main/All_Config.txt",
            "https://raw.githubusercontent.com/Argh94/V2RayAutoConfig/refs/heads/main/configs/Hysteria2.txt",
            "https://raw.githubusercontent.com/Argh94/V2RayAutoConfig/refs/heads/main/configs/Vless.txt",
            "https://raw.githubusercontent.com/Ashkan-m/v2ray/a4c9dcdb41aa71477aabb2588c241c27228163ba/Sub.txt",
            "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/14.txt",
            "https://raw.githubusercontent.com/AzadNetCH/Clash/refs/heads/main/AzadNet.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/4b1deddc866bb4b5e925cac9cd16db5782b59c27/nodes/yudou66.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/blues.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/clashmeta.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/nodefree.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/nodev2ray.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/v2rayshare.txt",
            "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/wenode.txt",
            "https://raw.githubusercontent.com/CidVpn/cid-vpn-config/main/general.txt",
            "https://raw.githubusercontent.com/Created-By/Telegram-Eag1e_YT/main/%40Eag1e_YT",
            "https://raw.githubusercontent.com/Crusader-Strike/AKBConf/e092ca19c23eae315e59facf829be930bf08229a/AKBConfigs.txt",
            "https://raw.githubusercontent.com/Danialsamadi/v2go/main/Splitted-By-Protocol/vmess.txt",
            "https://raw.githubusercontent.com/Egkaz/Proxy-list-20k-server/main/stable.txt",
            "https://raw.githubusercontent.com/Ennzo0/V2ray/e5bf5c5f54a1d8aad71975ccd8e988a3042920b7/all.txt"
        ];

        const configContainer = document.getElementById('configContainer');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('emptyState');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const statusMessage = document.getElementById('statusMessage');
        const counterEl = document.getElementById('counter');
        const sentinel = document.getElementById('sentinel');

        let currentConfigs = [];
        let displayedCount = 0;
        const CHUNK_SIZE = 30;

        async function fetchConfigs() {
            showLoader(true);
            hideStatus();
            displayedCount = 0;
            configContainer.innerHTML = '';
            
            try {
                const results = await Promise.allSettled(sources.map(url => fetch(url).then(r => r.text())));
                let allLines = [];
                results.forEach(res => {
                    if (res.status === 'fulfilled') {
                        allLines.push(...res.value.split('\n'));
                    }
                });

                currentConfigs = allLines
                    .map(line => line.trim())
                    .filter(line => line.toLowerCase().startsWith('vless://'))
                    .filter((v, i, a) => a.indexOf(v) === i); // Unique

                currentConfigs = shuffle(currentConfigs);
                
                counterEl.textContent = `Найдено: ${currentConfigs.length}`;
                renderNextBatch();
                showLoader(false);
            } catch (error) {
                showStatus('Критическая ошибка загрузки', 'bg-red-500/20 text-red-300 border border-red-500/50');
                showLoader(false);
                emptyState.classList.remove('hidden');
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function parseConfig(config) {
            try {
                const url = new URL(config.replace('vless://', 'http://'));
                const params = Object.fromEntries(url.searchParams);
                return { 
                    id: url.username, 
                    address: url.hostname, 
                    port: url.port, 
                    type: 'VLESS', 
                    security: params.security || 'none', 
                    sni: params.sni || 'none', 
                    type_net: params.type || 'tcp' 
                };
            } catch (e) {
                return null;
            }
        }

        function extractName(config) {
            try {
                if (config.includes('#')) {
                    return decodeURIComponent(config.split('#')[1]);
                }
            } catch(e) {}
            return null;
        }

        function renderNextBatch() {
            if (displayedCount >= currentConfigs.length) return;

            const nextBatch = currentConfigs.slice(displayedCount, displayedCount + CHUNK_SIZE);
            
            if (currentConfigs.length === 0) {
                emptyState.classList.remove('hidden');
                configContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            configContainer.classList.remove('hidden');

            nextBatch.forEach((config, index) => {
                const globalIndex = displayedCount + index;
                let name = extractName(config) || `Конфиг #${globalIndex + 1}`;
                const data = parseConfig(config);
                
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'flex flex-col';

                const card = document.createElement('div');
                card.className = 'config-card p-5 rounded-2xl flex justify-between items-center gap-4 shadow-xl shadow-black/20 relative z-10';
                
                const russianBadge = name.includes('🇷🇺') ? '<span class="text-green-400 text-[10px] ml-2 font-normal">(RU Mask)</span>' : '';

                card.innerHTML = `
                    <div class="overflow-hidden flex-1">
                        <h3 class="font-black text-purple-100 text-base mb-1 flex items-center">${name}${russianBadge}</h3>
                        <p class="text-xs text-purple-400/80 font-mono truncate">${config}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button class="details-btn bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-200 p-3 rounded-xl transition-all border border-indigo-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                        </button>
                        <button class="copy-single-btn bg-purple-600/30 hover:bg-purple-500 text-purple-100 p-3 rounded-xl transition-all border border-purple-500/30" data-config="${config}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                `;

                const details = document.createElement('div');
                details.className = 'details-panel bg-indigo-950/40 border-x border-b border-purple-500/20 rounded-b-2xl mx-2';
                if (data) {
                    details.innerHTML = `
                        <div class="p-4 grid grid-cols-2 gap-3 text-[11px]">
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Порт</span><span class="text-white font-bold">${data.port}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Сеть</span><span class="text-white">${data.type_net}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5 col-span-2"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">Адрес</span><span class="text-white font-mono break-all">${data.address}</span></div>
                            <div class="bg-black/20 p-2 rounded-lg border border-white/5 col-span-2"><span class="text-purple-400 block uppercase tracking-wider mb-1 text-[9px]">UUID</span><span class="text-white font-mono break-all">${data.id}</span></div>
                        </div>
                    `;
                }

                card.querySelector('.details-btn').onclick = () => {
                    const isOpen = details.classList.contains('open');
                    details.classList.toggle('open');
                    card.classList.toggle('rounded-b-none', !isOpen);
                };

                card.querySelector('.copy-single-btn').onclick = function() {
                    copyToClipboard(this.getAttribute('data-config'));
                    const original = this.innerHTML;
                    this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                    setTimeout(() => { this.innerHTML = original; }, 1000);
                };

                cardWrapper.appendChild(card);
                cardWrapper.appendChild(details);
                configContainer.appendChild(cardWrapper);
            });

            displayedCount += CHUNK_SIZE;
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && currentConfigs.length > displayedCount) {
                renderNextBatch();
            }
        }, { threshold: 0.1 });

        observer.observe(sentinel);

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        function showStatus(text, classes) {
            statusMessage.innerHTML = text;
            statusMessage.className = `mb-8 p-4 rounded-xl text-center font-bold ${classes}`;
            statusMessage.classList.remove('hidden');
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }

        function showLoader(show) {
            loader.classList.toggle('hidden', !show);
            if (show) {
                configContainer.classList.add('hidden');
                emptyState.classList.add('hidden');
                counterEl.textContent = 'Загрузка...';
            }
        }

        refreshBtn.onclick = fetchConfigs;

        copyAllBtn.onclick = () => {
            if (currentConfigs.length > 0) {
                copyToClipboard(currentConfigs.join('\n'));
                showStatus(`СКОПИРОВАНО ${currentConfigs.length} КОНФИГОВ`, 'bg-purple-500/20 text-purple-200 border border-purple-500/50');
                setTimeout(hideStatus, 3000);
            }
        };

        window.onload = fetchConfigs;
    </script>
</body>
</html>
